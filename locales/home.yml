# Home › What went wrong: a headline and a hint.
home.problem.provider_says:
  en: "Your provider says: “%{said}”"
  zh: "服务商提示：「%{said}」"
home.problem.provider_says_hint:
  en: "The link works, but the provider sent a message instead of locations. Do what it asks (often: allow fetching on its website), then try again."
  zh: "链接有效，但服务商返回了一条消息，而不是节点。请按提示操作（通常是在其网站上允许获取订阅），然后重试。"
home.problem.refused:
  en: "The provider refused this link."
  zh: "服务商拒绝了此链接。"
home.problem.refused_hint:
  en: "It may have expired or been reset (%{error}). Copy a fresh link from your provider."
  zh: "链接可能已过期或已被重置（%{error}）。请从服务商处复制新的链接。"
home.problem.unreachable:
  en: "Kairo can't reach the provider."
  zh: "Kairo 无法连接到服务商。"
# "Check that Paul's MacBook is online, then try again."
home.problem.check_online:
  en: "Check that %{machine} is online, then try again."
  zh: "请确认 %{machine} 已联网，然后重试。"
home.problem.check_online_phone:
  en: "Check that this phone is online, then try again."
  zh: "请确认这台手机已联网，然后重试。"
home.problem.check_online_computer:
  en: "Check that this Mac or PC is online, then try again."
  zh: "请确认这台电脑已联网，然后重试。"
home.problem.node_list:
  en: "This link gives a plain node list, not a Clash/mihomo config."
  zh: "此链接提供的是纯节点列表，而不是 Clash/mihomo 配置。"
home.problem.node_list_hint:
  en: "Ask your provider for the Clash or mihomo link (many have a “Clash” button next to it)."
  zh: "请向服务商索取 Clash 或 mihomo 订阅链接（很多服务商在旁边提供「Clash」按钮）。"
home.problem.bad_config:
  en: "This link doesn't give a config Kairo can use."
  zh: "此链接没有提供 Kairo 可用的配置。"
home.problem.bad_config_hint:
  en: "Check you copied the whole link. (%{error})"
  zh: "请确认复制了完整的链接。（%{error}）"

