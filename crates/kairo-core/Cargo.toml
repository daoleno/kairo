[package]
name = "kairo-core"
description = "Kairo's engine: mihomo core management, profiles, controller client, system proxy, TUN. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kairo-core-host = { path = "../kairo-core-host" }
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
libc = "0.2"
ed25519-dalek = "2"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
