[package]
name = "kairo-core"
description = "Kairo's engine: mihomo core management, profiles, controller client, system proxy, TUN. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# The engine: the core process, the controller, downloads, the system proxy and
# TUN. Without it the crate is Kairo's model (the data the UI shows and the
# protocol it speaks), which builds for the browser (wasm32) too.
default = ["engine"]
engine = [
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/process",
    "tokio/time",
    "tokio/fs",
    "tokio/io-util",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:flate2",
    "dep:uuid",
    "dep:rand",
    "dep:ed25519-dalek",
    "dep:tar",
    "dep:zip",
    "dep:image",
    "dep:windows",
    "dep:jni",
]

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", default-features = false, features = ["macros", "sync"] }
tokio-tungstenite = { version = "0.28", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"], optional = true }
sha2 = "0.10"
hex = "0.4"
flate2 = { version = "1", optional = true }
url = "2"
uuid = { version = "1", features = ["v4"], optional = true }
rand = { version = "0.9", optional = true }
libc = "0.2"
ed25519-dalek = { version = "2", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
