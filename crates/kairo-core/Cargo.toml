[package]
name = "kairo-core"
description = "Kairo's engine: mihomo core management, profiles, controller client, system proxy, TUN. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
libc = "0.2"
ed25519-dalek = "2"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
