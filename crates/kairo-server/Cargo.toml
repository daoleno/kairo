[package]
name = "kairo-server"
description = "Kairo on a machine with no screen: the engine, and its UI as a web page behind a password."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kairo-server"
path = "src/main.rs"

[dependencies]
kairo-core = { path = "../kairo-core" }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
base64 = "0.22"
env_logger = "0.11"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# IP_FREEBIND: a --listen address that is not up yet (DHCP at boot) is bound anyway.
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
