[package]
name = "kairo-server"
description = "Kairo on a machine with no screen: the engine, and its UI as a web page behind a password."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kairo-server"
path = "src/main.rs"

[dependencies]
kairo-core = { path = "../kairo-core" }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
base64 = "0.22"
env_logger = "0.11"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# IP_FREEBIND: a --listen address that is not up yet (DHCP at boot) is bound anyway.
socket2 = { version = "0.6", features = ["all"] }
# HTTPS of its own (--tls-cert/--tls-key), on the crypto reqwest already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Connections served with a header-read timeout and a cap (axum's own serve sets neither).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
# Static files streamed, not read whole.
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
