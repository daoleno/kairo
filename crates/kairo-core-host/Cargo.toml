[package]
name = "kairo-core-host"
description = "Runs the mihomo core for Kairo's Windows TUN mode, as a scheduled task or a service (SYSTEM), and ends it with the task."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kairo-core-host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows-service = "0.8"

