[package]
name = "kairo-core-host"
description = "Runs the mihomo core for Kairo's Windows TUN mode, as a scheduled task or a service (SYSTEM), and ends it with the task."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "kairo_core_host"
path = "src/lib.rs"

[[bin]]
name = "kairo-core-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
httparse = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows-service = "0.8"
