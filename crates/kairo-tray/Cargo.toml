[package]
name = "kairo-tray"
description = "Kairo's tray / menu bar item: StatusNotifierItem on Linux, NSStatusItem on macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
log = "0.4"
kairo-core = { path = "../kairo-core" }
tokio = { version = "1", features = ["sync", "rt", "time"] }
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSThread", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSImage", "NSResponder", "NSView", "NSApplication", "NSRunningApplication", "NSCell", "NSButtonCell", "NSActionCell"] }
dispatch2 = "0.3"
