# Temporary (redesign branch only): an Apple silicon build of Kairo.app with
# the macOS 26 SDK, to try the native chrome on a Mac. Removed before merging.
name: Spike
on:
  push:
    branches: [redesign]
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sw_vers; xcodebuild -version; xcrun --show-sdk-version
      - run: KAIRO_MAC_TARGETS=aarch64-apple-darwin scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kairo-spike-macos
          path: dist/*.zip
