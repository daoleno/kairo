name: Release

# Push a tag vX.Y.Z (matching Cargo.toml's version, with notes in
# docs/releases/vX.Y.Z.md) to build the packages and publish the release.
# Run it by hand (workflow_dispatch) to build every package without publishing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml $version"; exit 1; }
          fi
          test -s "docs/releases/v$version.md" || { echo "missing docs/releases/v$version.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The page of kairo-server, once (it is the same on every machine).
  web:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (nsh builds the app for this host too; clang for wasm C code)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev clang llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: nsh and wasm-bindgen (the version Cargo.lock pins)
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.4.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install wasm-bindgen-cli --version "$(cargo metadata --format-version 1 | python3 -c 'import sys,json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="wasm-bindgen"))')" --locked
      - name: The page
        env:
          AR_wasm32_unknown_unknown: llvm-ar
          CC_wasm32_unknown_unknown: clang
        run: |
          nsh package --target web -o dist/web .
          test -s dist/web/Kairo/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-page
          path: dist/web/Kairo

  linux:
    needs: [verify, web]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev librsvg2-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-linux.sh
      - run: scripts/package-deb.sh
      - name: The .deb installs, its dependencies resolve, and it carries the pinned core
        run: |
          . scripts/mihomo.env
          sudo apt-get install -y ./dist/kairo_*.deb
          dpkg -L kairo | grep -q /usr/bin/kairo
          test -x /usr/bin/kairo
          /usr/lib/kairo/mihomo -v | tee /dev/stderr | grep -q "Mihomo Meta $MIHOMO_VERSION "
          test -s /usr/share/doc/kairo/LICENSE.mihomo
          grep -q "MetaCubeX/mihomo/tree/$MIHOMO_VERSION" /usr/share/doc/kairo/copyright
          tar -tzf dist/Kairo-*.tar.gz | grep -q '/lib/kairo/mihomo$'
      - uses: actions/download-artifact@v4
        with:
          name: web-page
          path: web-page
      - name: kairo-server's package, and it starts and serves its page
        run: |
          scripts/package-server.sh web-page
          tar -tzf dist/Kairo-server-*.tar.gz | grep -q '/share/kairo/web/index.html$'
          dir=$(ls -d dist/Kairo-server-*/)
          home=$(mktemp -d)
          KAIRO_HOME=$home KAIRO_NO_SYSPROXY=1 "$dir/bin/kairo-server" serve --listen 127.0.0.1:7979 > server.log 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:7979/api/session && break; sleep 1; done
          curl -fsS http://127.0.0.1:7979/ | grep -q '<html'
          grep -q 'Setup code' server.log
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb

  macos:
    needs: verify
    # The macOS 26 SDK: AppKit draws Liquid Glass only for apps linked against it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: sw_vers; xcodebuild -version; xcrun --show-sdk-version
      - run: scripts/package-macos.sh
      - name: The app and its core are universal and signed
        run: |
          . scripts/mihomo.env
          for b in Kairo mihomo; do
            lipo -archs dist/Kairo.app/Contents/MacOS/$b | tee /dev/stderr | grep -q "x86_64 arm64"
          done
          dist/Kairo.app/Contents/MacOS/mihomo -v | tee /dev/stderr | grep -q "Mihomo Meta $MIHOMO_VERSION "
          codesign --verify --deep --strict dist/Kairo.app
          codesign -dv dist/Kairo.app 2>&1 | grep -E "Identifier|Signature"
          codesign -dv dist/Kairo.app/Contents/MacOS/mihomo 2>&1 | grep -E "Identifier|Signature"
          test -s dist/Kairo.app/Contents/Resources/LICENSE.mihomo
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup (the installer)
        run: choco install innosetup -y --no-progress
      - name: The zip (what Kairo updates itself from) and the per-user installer
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          scripts\package-windows.ps1
      - name: The zip has the program and its core, with forward-slash names
        shell: bash
        run: |
          python -I - dist/Kairo-*-windows-x86_64.zip <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          print(names)
          assert not any("\\" in n for n in names), names
          assert "Kairo/kairo.exe" in names and "Kairo/mihomo.exe" in names, names
          assert "Kairo/kairo-core-host.exe" in names and "Kairo/wintun.dll" in names, names
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (nsh builds the app for this host too)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: nsh (the command that builds the app's native part)
        run: |
          curl -fsSL https://nsh.dev/install.sh | NSH_VERSION=v0.4.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The APK, signed with the release key (kept in the repository's secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KAIRO_ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KAIRO_ANDROID_KEY_PASSWORD }}
        run: |
          (umask 077
           printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kairo-android.p12"
           printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/kairo-android.pass")
          KAIRO_ANDROID_KEYSTORE="$RUNNER_TEMP/kairo-android.p12" \
          KAIRO_ANDROID_KEY_PASSWORD_FILE="$RUNNER_TEMP/kairo-android.pass" \
            scripts/package-android.sh arm64-v8a dist
          rm -f "$RUNNER_TEMP/kairo-android.p12" "$RUNNER_TEMP/kairo-android.pass"
      - name: The APK holds the app, the core and the VPN service, and carries the release key
        run: |
          export KAIRO_PREVIOUS_ANDROID="$(scripts/previous-android-release.sh)"
          echo "previous release's APK: $KAIRO_PREVIOUS_ANDROID"
          scripts/check-android-apk.sh dist/Kairo-*-android-arm64-v8a.apk release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk

  publish:
    # On a tag: the release. By hand: everything but the release (the files,
    # the signed update manifest included, are kept as an artifact).
    needs: [verify, linux, macos, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Update manifest, signed with the key whose public half Kairo has built in
        env:
          KAIRO_UPDATE_KEY: ${{ secrets.KAIRO_UPDATE_KEY }}
        run: |
          scripts/update-manifest.sh dist "${{ needs.verify.outputs.version }}"
          key="$RUNNER_TEMP/update.pem"
          (umask 077 && printf '%s\n' "$KAIRO_UPDATE_KEY" > "$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/kairo-update.json -out "$RUNNER_TEMP/update.sig"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update.pub"
          rm -f "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update.pub" -in dist/kairo-update.json -sigfile "$RUNNER_TEMP/update.sig"
          built_in=$(sed -n 's/^const UPDATE_PUBLIC_KEY_HEX: &str = "\([0-9a-f]*\)";/\1/p' crates/kairo-core/src/update.rs)
          signing=$(openssl pkey -pubin -in "$RUNNER_TEMP/update.pub" -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n')
          test -n "$built_in" && test "$built_in" = "$signing" || { echo "the signing key is not the one Kairo trusts"; exit 1; }
          od -An -tx1 -v "$RUNNER_TEMP/update.sig" | tr -d ' \n' > dist/kairo-update.json.sig
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: release-dry-run
          path: dist/*
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Kairo ${{ needs.verify.outputs.version }}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
