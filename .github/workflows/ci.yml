name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · check, unit, e2e, TUN e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - name: The pinned mihomo core (the one the packages ship) for the e2e tests
        run: |
          scripts/fetch-mihomo.sh linux-x86_64 "$RUNNER_TEMP/core"
          echo "KAIRO_TEST_CORE=$RUNNER_TEMP/core/mihomo" >> "$GITHUB_ENV"
      - name: Unit and e2e tests (a real core on free ports)
        run: cargo test --workspace
      - name: TUN e2e in a user + network namespace
        run: |
          # Ubuntu 24.04 confines unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          scripts/tun-e2e.sh

  macos:
    name: macOS · check and unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test -p kairo-core --lib
