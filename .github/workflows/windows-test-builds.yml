name: Windows test builds

# For testing the updater end to end on a Windows machine: two builds of the
# installer and zip, the second with a higher version, both trusting the
# throwaway public key in windows-test/update-key.hex instead of the release
# key (the matching private key signs the update manifest on the tester's
# machine). Runs on pushes to windows-testbuild/* branches, which carry that
# file; nothing is released.
on:
  push:
    branches: ["windows-testbuild/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: choco install innosetup -y --no-progress
      - name: The throwaway update key
        shell: pwsh
        run: |
          $key = (Get-Content windows-test/update-key.hex -Raw).Trim()
          if ($key -notmatch '^[0-9a-f]{64}$') { throw "windows-test/update-key.hex is not a public key" }
          "KAIRO_TEST_UPDATE_KEY_HEX=$key" | Add-Content $env:GITHUB_ENV
      - name: The first build (the version in the repository)
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          scripts\package-windows.ps1
          New-Item -ItemType Directory -Force out\a | Out-Null
          Move-Item dist\Kairo-* out\a\
      - name: The second build (the next patch version)
        shell: pwsh
        run: |
          $v = [version](Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $next = "{0}.{1}.{2}" -f $v.Major, $v.Minor, ($v.Build + 1)
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$next`"" | Set-Content Cargo.toml
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          scripts\package-windows.ps1
          New-Item -ItemType Directory -Force out\b | Out-Null
          Move-Item dist\Kairo-* out\b\
      - name: "Only what the test needs (the first installer and the second zip)"
        shell: pwsh
        run: |
          Remove-Item out\a\*.zip, out\b\*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-builds
          path: out
