[package]
name = "nsh-app-kairo"
version = "0.3.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Kairo: a native mihomo client built with Native Shell"

[[bin]]
name = "kairo"
path = "src/main.rs"

[workspace]
members = [".", "crates/kairo-core", "crates/kairo-tray", "crates/kairo-core-host", "crates/kairo-server"]
default-members = [".", "crates/kairo-core", "crates/kairo-tray", "crates/kairo-core-host", "crates/kairo-server"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
log = "0.4"
kairo-core = { path = "crates/kairo-core", default-features = false }
url = "2"
serde = "1"
serde_json = "1"

# The desktop and phone apps run the engine in process; the web build (the
# page of `kairo-server`) has the model only and talks to a server.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kairo-core = { path = "crates/kairo-core", features = ["engine"] }
kairo-tray = { path = "crates/kairo-tray" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "Event",
    "Navigator",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Response",
    "Headers",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }
libadwaita = { version = "0.9", features = ["v1_5"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
dispatch2 = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
