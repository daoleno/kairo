[package]
name = "nsh-app-kairo"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Kairo: a native mihomo client built with Native Shell"

[[bin]]
name = "kairo"
path = "src/main.rs"

[workspace]
members = [".", "crates/kairo-core", "crates/kairo-tray"]
default-members = [".", "crates/kairo-core", "crates/kairo-tray"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
env_logger = "0.11"
log = "0.4"
kairo-core = { path = "crates/kairo-core" }
kairo-tray = { path = "crates/kairo-tray" }
url = "2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }
libadwaita = { version = "0.9", features = ["v1_5"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }
dispatch2 = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
